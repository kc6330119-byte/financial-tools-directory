[build]
  command = "pip install -r requirements.txt && python build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.9"

# Enable pretty URLs
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/methodology"
  to = "/methodology.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/success"
  to = "/success/index.html"
  status = 200

[[redirects]]
  from = "/success/"
  to = "/success/index.html"
  status = 200

[[redirects]]
  from = "/tools"
  to = "/tools.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

# Edge-level bot filter: 403s traffic from blocked countries (default: Singapore)
# before it reaches the site — stops the GA-polluting bot flood. Legit crawlers
# (Googlebot, AdSense, Bing) are always allowed. Disable without a redeploy via
# env EDGE_BLOCK_ENABLED=false; change the list via env EDGE_BLOCKED_COUNTRIES.
# See netlify/edge-functions/block-bot-traffic.js.
[[edge_functions]]
  path = "/*"
  function = "block-bot-traffic"
